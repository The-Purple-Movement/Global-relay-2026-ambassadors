[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Supabase URL, anon key and bucket name are public by design: Vite inlines
  # VITE_* vars into the client bundle, and access is enforced by RLS policies.
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY,VITE_SUPABASE_STORAGE_BUCKET"
